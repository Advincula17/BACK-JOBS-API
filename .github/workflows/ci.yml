
name: CI/CD - Build, Test and Deploy

on:
  push:
    branches:
      - main
      - ci-cd-tp2
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean verify

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-cd-tp2'

    steps:
      - name: Trigger Render deployment
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS "$DEPLOY_URL"
